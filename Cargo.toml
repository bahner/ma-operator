[package]
name = "zion"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "zion – MA Actor identity and messaging workstation"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
ma-core = { version = "^0.14", default-features = false, features = ["config", "iroh", "acl"] }
ma-zscheme = "0.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlCanvasElement",
    "HtmlVideoElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "KeyboardEvent",
    "ClipboardEvent",
    "DataTransfer",
    "Performance",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "FileReader",
    "FileList",
    "File",
    "Event",
    "EventTarget",
    "MouseEvent",
    "InputEvent",
    "DomStringList",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbRequest",
    "IdbOpenDbRequest",
    "IdbKeyRange",
    "IdbCursorWithValue",
    "IdbVersionChangeEvent",
    "Navigator",
    "Response",
    "Headers",
    "Request",
    "RequestInit",
    "AbortController",
    "AbortSignal",
    "Storage",
] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_ipld_dagcbor = "0.6"
base64 = "0.22"
getrandom = { version = "0.4", features = ["wasm_js"] }
gloo-timers = { version = "0.4", features = ["futures"] }
web-time = "1"
console_error_panic_hook = "0.1"
cid = "0.11"
ciborium = "0.2"
log = "0.4"
env_logger = "0.11"
console_log = "1"
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
futures-channel = "0.3.32"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rqrr = { version = "0.10.1", default-features = false }
